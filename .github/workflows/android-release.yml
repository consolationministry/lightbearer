name: Android signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for the next signed release
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bump and tag the next release
        id: release_version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_REF" != "main" ]]; then
              echo "Run this release workflow from the main branch." >&2
              exit 1
            fi

            version="$(node scripts/bump-version.mjs "${RELEASE_BUMP:-patch}")"
            tag="v$version"
            if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
              # A rerun after a partial release should reuse the already-created tag.
              git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              tagged_version="$(git show "$tag:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
              if [[ "$tagged_version" != "$version" ]]; then
                echo "Existing tag $tag does not contain version $version." >&2
                exit 1
              fi
              git checkout --detach "$tag"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json js/version.js service-worker.js manifest.webmanifest
              git commit -m "Release $tag"
              git tag -a "$tag" -m "C&S Bible Church Hymnal $tag"
              git push origin HEAD:refs/heads/main "refs/tags/$tag"
            fi
          else
            version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
            tag="$RELEASE_REF"
            if [[ "$tag" != "v$version" ]]; then
              echo "Release tag $tag must match package.json version v$version." >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing signed release $tag."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare npm lockfile for GitHub
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const lockfilePath = "package-lock.json";
          const privatePrefix = "http://package-firewall.replit.internal/npm/";
          const publicPrefix = "https://registry.npmjs.org/";
          const original = readFileSync(lockfilePath, "utf8");
          const count = original.split(privatePrefix).length - 1;
          const normalized = original.replaceAll(privatePrefix, publicPrefix);

          if (normalized.includes("package-firewall.replit.internal")) {
            throw new Error("The npm lockfile still contains a Replit-only registry URL.");
          }
          if (count === 0 && !original.includes(publicPrefix)) {
            throw new Error("No recognized npm registry URLs were found in package-lock.json.");
          }
          if (count > 0) {
            writeFileSync(lockfilePath, normalized);
            console.log("Normalized " + count + " package URLs for GitHub Actions.");
          }
          NODE

      - name: Install, test, and build shared web app
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npm test
          npm run build


      - name: Package shared app for Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          let encoded = (process.env.ANDROID_KEYSTORE_BASE64 || "").replace(/\s/g, "");
          encoded = encoded.replace(/^data:[^,]*base64,/, "").replace(/-/g, "+").replace(/_/g, "/");
          if (!encoded || /[^A-Za-z0-9+/=]/.test(encoded)) {
            throw new Error("ANDROID_KEYSTORE_BASE64 is missing or invalid.");
          }
          const keystore = Buffer.from(encoded, "base64");
          if (!keystore.length) throw new Error("Decoded Android keystore is empty.");
          const keystorePath = path.join(process.env.RUNNER_TEMP, "cns-lightbearer-release.jks");
          writeFileSync(keystorePath, keystore, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, "ANDROID_KEYSTORE_PATH=" + keystorePath + "\n");
          NODE

      - name: Prepare Android version and signing config
        run: node scripts/prepare-android.mjs

      - name: Build signed member APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret." >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret." >&2; exit 1; }
          cd android
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk /tmp/cns-lightbearer-android.apk

      - name: Build signed admin APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LIGHTBEARER_ADMIN_BUILD: "true"
        run: |
          set -euo pipefail
          mv android android-member
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("capacitor.config.json", "utf8"));
          config.appId = "org.consolationministry.lightbearer.admin";
          config.appName = "Lightbearer Admin";
          config.server = Object.assign({}, config.server, { appStartPath: "/admin/index.html" });
          writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2) + "\n");
          NODE
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs
          cd android
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk /tmp/cns-lightbearer-admin.apk

      - name: Commit version, create tag, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          member_apk="/tmp/cns-lightbearer-android.apk"
          admin_apk="/tmp/cns-lightbearer-admin.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$member_apk" "$admin_apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$member_apk" "$admin_apk" \
              --title "C&S Bible Church Hymnal $RELEASE_TAG" \
              --notes "Signed Android updates for version ${RELEASE_TAG#v}: member hymnal app and admin app."
          fi
